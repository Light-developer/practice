<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Secure SOLEA partner portal login.">
  <title>Vendor Login — SOLEA</title>
  <link rel="stylesheet" href="vendor-login.css">
</head>
<body>
  <header class="site-header">
    <div class="container nav-wrap">
      <a class="logo" href="index.html">SOLEA<span>®</span></a>
      <a class="text-link" href="vendor.html">Become a partner ↗</a>
    </div>
  </header>

  <main class="auth-shell">
    <section class="auth-card">
      <p class="eyebrow">SOLEA PARTNER PORTAL</p>
      <h1>Welcome<br><em>back.</em></h1>
      <p class="auth-copy">Sign in securely to manage your house, collection and marketplace orders.</p>

      <form id="vendorLoginForm" class="auth-form" novalidate>
        <label>
          Email
          <input id="vendorEmail" type="email" autocomplete="email" required placeholder="you@yourbrand.com">
        </label>
        <label>
          Password
          <input id="vendorPassword" type="password" autocomplete="current-password" required placeholder="Your password">
        </label>
        <button class="btn btn-dark" type="submit">Enter dashboard <span>↗</span></button>
      </form>

      <p class="auth-note">New to SOLEA? <a href="vendor-register.html">Create a partner account</a></p>
      <p class="demo-note">Your session is protected by an HTTP-only server cookie. Passwords are never stored in this browser.</p>
    </section>
  </main>

  <div class="toast" id="toast"></div>
  <script>window.SOLEA_API_URL = window.SOLEA_API_URL || 'http://localhost:4000';</script>
  <script src="vendor.js" defer></script>
</body>
</html>
