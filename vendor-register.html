<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Apply to become a footwear partner on SOLEA.">
  <title>Join SOLEA — Vendor Registration</title>
  <link rel="stylesheet" href="style.css">
  <link rel="stylesheet" href="vendor-dashboard.css">
</head>
<body class="dashboard-body">
  <header class="site-header">
    <div class="container nav-wrap">
      <a class="logo" href="index.html">SOLEA<span>®</span></a>
      <a class="text-link" href="vendor-login.html">Partner login ↗</a>
    </div>
  </header>

  <main class="auth-shell">
    <section class="auth-card wide reveal">
      <p class="eyebrow">JOIN THE MARKETPLACE</p>
      <h1>Open your<br><em>house.</em></h1>
      <p class="auth-copy">Create your SOLEA partner profile. Your application will be reviewed before your collection is published.</p>

      <form id="vendorRegisterForm" class="auth-form" novalidate>
        <div class="auth-two">
          <label>
            Brand name
            <input id="registerBrand" autocomplete="organization" required maxlength="160" placeholder="Your footwear house">
          </label>
          <label>
            Work email
            <input id="registerEmail" type="email" autocomplete="email" required placeholder="you@yourbrand.com">
          </label>
        </div>

        <div class="auth-two">
          <label>
            Password
            <input id="registerPassword" type="password" autocomplete="new-password" minlength="10" required placeholder="At least 10 characters">
          </label>
          <label>
            Country
            <input id="registerCountry" autocomplete="country-name" required placeholder="Nigeria">
          </label>
        </div>

        <label>
          Brand story
          <textarea id="registerStory" maxlength="5000" placeholder="Tell customers what makes your house distinctive."></textarea>
        </label>

        <button class="btn btn-dark" type="submit">Create partner account <span>↗</span></button>
      </form>

      <p class="auth-note">Already partnered? <a href="vendor-login.html">Sign in</a></p>
      <p class="demo-note">Applications are securely stored on the SOLEA server. Use a strong, unique password.</p>
    </section>
  </main>

  <div class="toast" id="toast"></div>
  <script>window.SOLEA_API_URL = window.SOLEA_API_URL || 'http://localhost:4000';</script>
  <script src="script.js"></script>
  <script src="vendor.js"></script>
</body>
</html>
